# 打 tag（v*）觸發三平台打包，產物上傳到 GitHub Release。三平台 build 全綠後 publish job 自動轉正式發布（任一平台失敗則留 draft）。
# 簽章現況：macOS ad-hoc / Windows 未簽——自用與小範圍分發 OK，
# 安裝時 macOS 需右鍵開啟（或 xattr -dc）、Windows 會見 SmartScreen 提示。
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # 供應鏈守門（OWASP 2025 A03）：掃 src-tauri/Cargo.lock 的已知 advisory。
  # 獨立 job、不塞進三平台 matrix（Rust 依賴跨平台一致，跑一次即可）。
  # 刻意不被 build 的 needs 依賴：audit 紅燈是可見信號，但不硬擋 draft release 產出。
  audit:
    name: Cargo audit (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cargo install 需編譯（約 2-3 分鐘）；release 不頻繁可接受，嫌慢可改用 prebuilt binary。
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri

  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest # Intel（cross-compile）
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: windows-latest # Windows x64（NSIS）
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run test

      # Rust 端測試（含 CSS sanitizer 的外連繞過 regression）——沒有這步，
      # src-tauri 的 #[cfg(test)] 在 CI 一次都不會跑，退化會直接出貨。
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_APP_ARCH: ${{ matrix.rust-targets }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Plume ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}

  # 三平台 build 全數成功後自動把 draft 轉為正式發布。needs: build 確保產物齊全才公開，
  # 避免單純關掉 draft 時，第一個完成的平台搶先公開、其餘平台檔案還沒上傳的空窗。
  # 任一平台 build 失敗則此 job 不執行，release 留在 draft（安全）。
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Release notes 取自雙語 CHANGELOG 的該版段落。刻意不用 tauri-action 的 releaseBody：
      # 那個 input 會在三平台 matrix 各跑一次，還得應付 Windows runner 的 shell 差異；
      # 這裡只跑一次、在 ubuntu 上。draft 期間 body 仍是 commit message，但 draft 不對外。
      # 條件判斷一律寫成 if/fi——`[ ... ] && cmd` 在條件為假時整行 exit 1，會被 bash -e 當失敗。
      - name: Compose release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          extract() {
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { buf = buf $0 "\n" }
              END { sub(/^\n+/, "", buf); sub(/\n+$/, "\n", buf); printf "%s", buf }
            ' "$1"
          }
          ZH="$(extract CHANGELOG.md)"
          EN="$(extract CHANGELOG_EN.md)"
          # 抽不到段落不讓發版整條紅掉——產物已經上傳，缺的只是說明文字
          if [ -z "$ZH" ] && [ -z "$EN" ]; then
            echo "::warning::No CHANGELOG section for $VERSION — release notes will carry install instructions only"
          fi
          {
            if [ -n "$ZH" ]; then printf '%s\n---\n\n' "$ZH"; fi
            if [ -n "$EN" ]; then printf '%s\n---\n\n' "$EN"; fi
            cat <<'NOTES'
          ## 安裝 / Installation

          **macOS**：下載 `.dmg`（Apple Silicon 選 `aarch64`，Intel 選 `x64`）。首次開啟請對 Plume.app **按右鍵 →「打開」**；若顯示「已損毀」，執行 `xattr -dc /Applications/Plume.app`。本版為 ad-hoc 簽章，未經 Apple 公證。

          **Windows**：下載 `.exe`（NSIS）或 `.msi`。未經程式碼簽章，SmartScreen 會要你確認「仍要執行」。

          ---

          **macOS**: grab the `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel). On first launch, **right-click Plume.app → Open**; if macOS calls it "damaged", run `xattr -dc /Applications/Plume.app`. This build is ad-hoc signed, not notarized by Apple.

          **Windows**: grab the `.exe` (NSIS) or `.msi`. Unsigned, so SmartScreen will ask you to confirm.
          NOTES
          } > release-notes.md
          echo "--- composed notes ---"
          cat release-notes.md

      - name: Publish release with notes once all platforms are uploaded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --draft=false \
            --repo "${{ github.repository }}"
