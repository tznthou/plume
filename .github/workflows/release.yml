# 打 tag（v*）觸發三平台打包，產物上傳到 GitHub Release。三平台 build 全綠後 publish job 自動轉正式發布（任一平台失敗則留 draft）。
# 簽章現況：macOS ad-hoc / Windows 未簽——自用與小範圍分發 OK，
# 安裝時 macOS 需右鍵開啟（或 xattr -dc）、Windows 會見 SmartScreen 提示。
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # 供應鏈守門（OWASP 2025 A03）：掃 src-tauri/Cargo.lock 的已知 advisory。
  # 獨立 job、不塞進三平台 matrix（Rust 依賴跨平台一致，跑一次即可）。
  # 刻意不被 build 的 needs 依賴：audit 紅燈是可見信號，但不硬擋 draft release 產出。
  audit:
    name: Cargo audit (supply chain)
    runs-on: ubuntu-latest
    # 刻意不跟隨 rust-toolchain.toml：這個 job 只比對 Cargo.lock 與 advisory DB，跟產物無關，
    # 而 cargo-audit 自己的安裝需要夠新的 rustc。RUSTUP_TOOLCHAIN 的優先序高於 toml，
    # 沒有這行的話 toml 會讓這裡改用釘住的舊版編譯 cargo-audit，某天就會無聲卡住。
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cargo install 需編譯（約 2-3 分鐘）；release 不頻繁可接受，嫌慢可改用 prebuilt binary。
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri

  # 先把 release 建好再讓三平台上傳。tauri-action 預設行為是「查不到該 tag 的 draft 就自己建一個」，
  # 三個 build job 平行跑時那個「查詢→建立」之間有競態窗口。v0.16.0 實際踩到：x64 於 05:46:08
  # 建立 release，aarch64 於 05:46:09 查詢仍看不到，於是又建了第二個——同一個 tag 兩個 release，
  # Apple Silicon 的 dmg 與 app.tar.gz 全留在沒人看得到的 draft 裡，正式那份只有 x64 與 Windows。
  # v0.15.0 沒撞上純粹是兩個 macOS job 差了 89 秒；v0.16.0 因 Rust cache 命中而只差 2 秒。
  # 把「建立」收斂成單一 job，build 只上傳不建立，競態就不存在了（而非靠 max-parallel 排隊迴避）。
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create or reuse draft release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # 重跑整條 workflow 時必須重用既有 release——再建一個就是親手製造
          # 這個 job 要消滅的「同 tag 雙 release」。
          matches="$(gh api "repos/$REPO/releases" --paginate \
                       --jq "[.[] | select(.tag_name == \"$TAG\")] | length")"
          if [ "$matches" -gt 1 ]; then
            # 已經處於本 job 要防止的狀態。此時「挑一個」是隨機的——API 回傳順序不保證，
            # 實測 v0.16.0 事故時挑到的正是資產不全的那份。寧可停下要求人工清理。
            echo "::error::找到 $matches 個 tag 為 $TAG 的 release。同 tag 多個 release 需人工清理後再重跑。"
            exit 1
          fi
          id="$(gh api "repos/$REPO/releases" --paginate \
                  --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")"
          if [ -n "$id" ]; then
            echo "Reusing existing release $id for $TAG"
          else
            id="$(gh api -X POST "repos/$REPO/releases" \
                    -f tag_name="$TAG" \
                    -f name="Plume $TAG" \
                    -F draft=true \
                    --jq '.id')"
            echo "Created draft release $id for $TAG"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest # Intel（cross-compile）
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: windows-latest # Windows x64（NSIS）
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # 版本只宣告在 rust-toolchain.toml，這裡讀出來傳給 action。
      # 這個 action 沒有讀 toml 的能力（toolchain 是 required input），若在 workflow 另寫
      # 一份版本號，兩邊遲早分岔而且沒有東西會發現 —— 跟 Node 那邊改用 node-version-file 同理。
      - name: Read rust toolchain
        id: rust
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run test

      # Rust 端測試（含 CSS sanitizer 的外連繞過 regression）——沒有這步，
      # src-tauri 的 #[cfg(test)] 在 CI 一次都不會跑，退化會直接出貨。
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_APP_ARCH: ${{ matrix.rust-targets }}
        with:
          # 指定 releaseId 後 tauri-action 只上傳、不查也不建，競態消失。
          # tagName / releaseName / releaseDraft 是「建立」時才用得到的參數，已無作用。
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # 三平台 build 全數成功後自動把 draft 轉為正式發布。needs: build 確保產物齊全才公開，
  # 避免單純關掉 draft 時，第一個完成的平台搶先公開、其餘平台檔案還沒上傳的空窗。
  # 任一平台 build 失敗則此 job 不執行，release 留在 draft（安全）。
  publish:
    # 也 needs create-release：既為了取它的 release_id output，也讓依賴關係與實際用到的東西一致。
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Release notes 取自雙語 CHANGELOG 的該版段落。刻意不用 tauri-action 的 releaseBody：
      # 那個 input 會在三平台 matrix 各跑一次，還得應付 Windows runner 的 shell 差異；
      # 這裡只跑一次、在 ubuntu 上。draft 期間 body 仍是 commit message，但 draft 不對外。
      # 條件判斷一律寫成 if/fi——`[ ... ] && cmd` 在條件為假時整行 exit 1，會被 bash -e 當失敗。
      - name: Compose release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          extract() {
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { buf = buf $0 "\n" }
              END { sub(/^\n+/, "", buf); sub(/\n+$/, "\n", buf); printf "%s", buf }
            ' "$1"
          }
          ZH="$(extract CHANGELOG.md)"
          EN="$(extract CHANGELOG_EN.md)"
          # 抽不到段落不讓發版整條紅掉——產物已經上傳，缺的只是說明文字
          if [ -z "$ZH" ] && [ -z "$EN" ]; then
            echo "::warning::No CHANGELOG section for $VERSION — release notes will carry install instructions only"
          fi
          {
            if [ -n "$ZH" ]; then printf '%s\n---\n\n' "$ZH"; fi
            if [ -n "$EN" ]; then printf '%s\n---\n\n' "$EN"; fi
            cat <<'NOTES'
          ## 安裝 / Installation

          **macOS**：下載 `.dmg`（Apple Silicon 選 `aarch64`，Intel 選 `x64`）。首次開啟請對 Plume.app **按右鍵 →「打開」**；若顯示「已損毀」，執行 `xattr -dc /Applications/Plume.app`。本版為 ad-hoc 簽章，未經 Apple 公證。

          **Windows**：下載 `.exe`（NSIS）或 `.msi`。未經程式碼簽章，SmartScreen 會要你確認「仍要執行」。

          ---

          **macOS**: grab the `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel). On first launch, **right-click Plume.app → Open**; if macOS calls it "damaged", run `xattr -dc /Applications/Plume.app`. This build is ad-hoc signed, not notarized by Apple.

          **Windows**: grab the `.exe` (NSIS) or `.msi`. Unsigned, so SmartScreen will ask you to confirm.
          NOTES
          } > release-notes.md
          echo "--- composed notes ---"
          cat release-notes.md

      - name: Publish release with notes once all platforms are uploaded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          # 用 release id 而非 tag name：`gh release edit <tag>` 在同一個 tag 有多個 release 時
          # 只會挑到其中一個，v0.16.0 正是這樣把 x64 那份轉正式、Apple Silicon 那份留在 draft。
          # 即使上游競態已修，這裡仍該指名 id——publish 是最後一道，不該靠「只會有一個」的假設。
          jq -n --rawfile body release-notes.md '{body: $body, draft: false}' \
            | gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" --input -
